<script type="text/javascript">
    RED.nodes.registerType('zscada-bacnet-client', {
        category: 'config',
        defaults: {
            name: { value: '' },
            iface: { value: '0.0.0.0' },
            localPort: { value: 47809, required: true, validate: RED.validators.number() },
            apduTimeout: { value: 3000, required: true, validate: RED.validators.number() }
        },
        label: function () { return this.name || ('BACnet ' + this.iface + ':' + this.localPort); }
    });
</script>
<script type="text/html" data-template-name="zscada-bacnet-client">
    <div class="form-row"><label for="node-config-input-name">Ad</label><input type="text" id="node-config-input-name"></div>
    <div class="form-row"><label for="node-config-input-iface">Yerel arayüz</label><input type="text" id="node-config-input-iface" placeholder="0.0.0.0"></div>
    <div class="form-row"><label for="node-config-input-localPort">Yerel UDP port</label><input type="text" id="node-config-input-localPort"></div>
    <div class="form-row"><label for="node-config-input-apduTimeout">APDU zaman aşımı (ms)</label><input type="text" id="node-config-input-apduTimeout"></div>
</script>
<script type="text/html" data-help-name="zscada-bacnet-client">
    <p>Z SCADA BACnet/IP istemcisi. Yerel arayüz ve UDP portunda dinler; yayın ve Who-Is göndermez. Akış Z SCADA tarafından üretilir.</p>
</script>
<script type="text/javascript">
    RED.nodes.registerType('zscada-bacnet-read', {
        category: 'network',
        color: '#c0deed',
        defaults: {
            name: { value: '' },
            client: { value: '', type: 'zscada-bacnet-client', required: true },
            address: { value: '', required: true },
            port: { value: 47808, required: true, validate: RED.validators.number() }
        },
        inputs: 1,
        outputs: 1,
        icon: 'bridge.svg',
        label: function () { return this.name || ('BACnet ' + this.address + ':' + this.port); }
    });
</script>
<script type="text/html" data-template-name="zscada-bacnet-read">
    <div class="form-row"><label for="node-input-name">Ad</label><input type="text" id="node-input-name"></div>
    <div class="form-row"><label for="node-input-client">İstemci</label><input type="text" id="node-input-client"></div>
    <div class="form-row"><label for="node-input-address">Cihaz IPv4</label><input type="text" id="node-input-address"></div>

</script>
<script type="text/html" data-help-name="zscada-bacnet-read">
    <p>Cihazın tekil IPv4:port adresine ReadPropertyMultiple gönderir. Girdi <code>msg.bacnetObjects</code>, çıktı <code>msg.payload</code> ya da <code>msg.error</code>.</p>
</script>
